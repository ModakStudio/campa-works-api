name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/my-project release/
          tar -czf my-project-${{ matrix.target }}.tar.gz -C release .

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          mkdir release
          copy target\${{ matrix.target }}\release\my-project.exe release\
          Compress-Archive release\* my-project-${{ matrix.target }}.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz